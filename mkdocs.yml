site_name: Topekox Belajar

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - tables
  - pymdownx.tilde
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details

nav:
  - Home: index.md

  - Disaster AI System:
    - "Intro": disaster-ai-system/index.md
    - NLP Foundation:
      - "Python untuk NLP": disaster-ai-system/01-nlp/01-python-untuk-nlp.md
      - "Fundamental NLP": disaster-ai-system/01-nlp/02-fundamentals-nlp.md
      - "Regex": disaster-ai-system/01-nlp/03-regex.md
      - "Text Processing": disaster-ai-system/01-nlp/04-text-preprocessing.md
      - "Text Representation & TF-IDF": disaster-ai-system/01-nlp/05-text-representation.md
      - "Machine Learning untuk NLP": disaster-ai-system/01-nlp/06-machine-learning-nlp.md
      - "Evaluasi NLP Klasifikasi Text": disaster-ai-system/01-nlp/07-evaluasi-nlp-klasifikasi-text.md
    - Deep Learning:  
      - "Word Embedding": disaster-ai-system/02-deeplearning/08-word-embedding.md
      - "Deep Learning untuk NLP": disaster-ai-system/02-deeplearning/09-deep-learning.md
      - "RNN - LSTM - GRU": disaster-ai-system/02-deeplearning/10-RNN-LSTM-GRU.md
    - Transformer:
      - "Attention Mechanism": disaster-ai-system/03-transformer/11-attention-mechanism.md
      - "Transformer": disaster-ai-system/03-transformer/12-transformer.md
      - "BERT": disaster-ai-system/03-transformer/13-BERT.md
    - IndoBert:
      - "IndoBERT": disaster-ai-system/04-indobert/14-IndoBERT.md
      - "Fine-Tuning IndoBERT": disaster-ai-system/04-indobert/15-fine-tuningIndoBERT.md
      - "Eksperimen Penelitian": disaster-ai-system/04-indobert/16-eksperimen-penelitian.md
      - "Dataset Penelitian": disaster-ai-system/04-indobert/17-dataset-penelitian.md
    - Research:
      - "Data Annotation": disaster-ai-system/05-research/18-data-annotation.md
      - "Imbalanced Dataset": disaster-ai-system/05-research/19-imbalanced-dataset.md
      - "Explainable AI": disaster-ai-system/05-research/20-explainable-AI.md
    - Product:
      - "REST API": disaster-ai-system/06-product/21-rest-api.md
      - "Dashboard": disaster-ai-system/06-product/22-dashboard.md
      - "Jadikan Penelitian": disaster-ai-system/06-product/23-jadikan-penelitian.md

  - English:
    - Beginner:
      - "Lesson 1: Nice to Meet You": english/beginner/leasson-1.md
      - "Lesson 2: How Are You?": english/beginner/leasson-2.md
      - "Lesson 3: What Does She Look Like?": english/beginner/leasson-3.md

# Custom CSS
extra_css:
  - stylesheets/extra.css

# MathJax (LaTeX equation rendering via pymdownx.arithmatex)
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
