site_name: Topekox Belajar

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - tables
  - pymdownx.tilde
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details

nav:
  - Home: index.md
  - Disaster AI System:
    - Natural Language Processing:
      - "Python untuk NLP": disaster-ai-system/nlp/01-python-untuk-nlp.md
      - "Fundamental NLP": disaster-ai-system/nlp/02-fundamentals-nlp.md
      - "Regex": disaster-ai-system/nlp/03-regex.md
      - "Text Processing": disaster-ai-system/nlp/04-text-preprocessing.md
      - "Text Representation": disaster-ai-system/nlp/05-text-representation.md
      - "Machine Learning untuk NLP": disaster-ai-system/nlp/06-machine-learning-nlp.md
      - "Word Embedding": disaster-ai-system/nlp/07-word-embedding.md
      - "Deep Learning untuk NLP": disaster-ai-system/nlp/08-deep-learning.md
      - "RNN - LSTM - GRU": disaster-ai-system/nlp/09-RNN-LSTM-GRU.md
  - English:
    - Beginner:
      - "Lesson 1: Nice to Meet You": english/beginner/leasson-1.md
      - "Lesson 2: How Are You?": english/beginner/leasson-2.md
      - "Lesson 3: What Does She Look Like?": english/beginner/leasson-3.md

# Custom CSS
extra_css:
  - stylesheets/extra.css

# MathJax (LaTeX equation rendering via pymdownx.arithmatex)
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
